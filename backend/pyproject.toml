[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["venv", "alembic/versions"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear
select = ["E", "F", "I", "B"]
ignore = [
    "E501",  # long lines are handled by the formatter where possible
    "B008",  # FastAPI's Depends() in argument defaults is idiomatic
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]  # not the local alembic/ migrations folder

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
